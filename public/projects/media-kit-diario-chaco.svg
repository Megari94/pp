<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Media Kit de Diario Chaco</title>
  <desc id="desc">Vista ilustrada del media kit de Diario Chaco con su paleta real: negro, grafito y rojo</desc>
  <defs>
    <linearGradient id="mk-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B1D21" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#mk-bg)" />

  <rect width="640" height="46" fill="#0A0A0A" />
  <text x="28" y="29" font-family="'Space Grotesk',sans-serif" font-size="17" font-weight="700" letter-spacing="0.5" fill="#FFFFFF">DIARIO CHACO</text>
  <text x="150" y="29" font-family="'Space Grotesk',sans-serif" font-size="10" letter-spacing="2" fill="#75787D">MEDIA KIT</text>
  <g font-family="'Space Grotesk',sans-serif" font-size="10" fill="#B7B9BE" letter-spacing="0.5">
    <text x="420" y="28">PORTAL</text>
    <text x="480" y="28">CONTENIDO</text>
    <text x="570" y="28">CONTACTO</text>
  </g>
  <rect x="0" y="45" width="640" height="2" fill="#BC0101" />

  <text x="32" y="128" font-family="'Space Grotesk',sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Publicidad que</text>
  <text x="32" y="168" font-family="'Space Grotesk',sans-serif" font-size="34" font-weight="700" fill="#BC0101">conecta con tu marca</text>
  <text x="32" y="198" font-family="'Space Grotesk',sans-serif" font-size="13" fill="#B7B9BE">Formatos, contenido y audiencia en un mismo lugar.</text>
  <rect x="32" y="220" width="150" height="38" rx="4" fill="#BC0101" />
  <text x="107" y="244" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Ver formatos</text>

  <g font-family="'IBM Plex Mono','Space Grotesk',monospace">
    <rect x="360" y="80" width="230" height="70" rx="3" fill="none" stroke="#3A3D43" stroke-width="1.5" />
    <text x="475" y="120" text-anchor="middle" font-size="11" fill="#75787D">BANNER TOP · 970x250</text>

    <rect x="360" y="164" width="108" height="90" rx="3" fill="none" stroke="#3A3D43" stroke-width="1.5" />
    <text x="414" y="212" text-anchor="middle" font-size="10" fill="#75787D">FULL</text>
    <text x="414" y="224" text-anchor="middle" font-size="10" fill="#75787D">BANNER</text>

    <rect x="482" y="164" width="108" height="90" rx="3" fill="none" stroke="#BC0101" stroke-width="1.5" />
    <text x="536" y="206" text-anchor="middle" font-size="10" fill="#BC0101">BANNER</text>
    <text x="536" y="218" text-anchor="middle" font-size="10" fill="#BC0101">BOX</text>

    <rect x="360" y="270" width="230" height="34" rx="3" fill="none" stroke="#3A3D43" stroke-width="1.5" />
    <text x="475" y="291" text-anchor="middle" font-size="10" fill="#75787D">ZOCALO FIJO · 970x90</text>
  </g>
</svg>
